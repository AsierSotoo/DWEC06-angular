<div class="form-container" *ngIf="user; else loading">
  <h1>Editar usuario</h1>
  <p class="subtitle">Modifica los datos del usuario seleccionado.</p>

  <form (ngSubmit)="updateUser()" #form="ngForm">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" name="name" [(ngModel)]="user.name" required />
    </div>

    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="username" [(ngModel)]="user.username" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="user.email" required />
    </div>

    <div class="actions">
      <button type="submit" class="btn primary" [disabled]="form.invalid">
        Guardar cambios
      </button>
      <a routerLink="/users" class="btn secondary">Cancelar</a>
    </div>
  </form>
</div>

<ng-template #loading>
  <p class="loading">Cargando usuario...</p>
</ng-template>
